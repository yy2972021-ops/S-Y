<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shine & May - Been In Love</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      border-radius: 25px;
      padding: 30px 20px;
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.25);
      text-align: center;
    }

    .title {
      color: #ff4757;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 25px;
      letter-spacing: 1.5px;
    }

    .profiles {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 25px;
    }

    .avatar-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: 3px solid #ff6b81;
      object-fit: cover;
      box-shadow: 0 5px 15px rgba(255, 107, 129, 0.3);
      background-color: #ffeaa7;
    }

    .name {
      margin-top: 10px;
      font-weight: 700;
      color: #2f3542;
      font-size: 1rem;
    }

    .heart-icon {
      font-size: 2.2rem;
      color: #ff4757;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    .counter-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(255, 71, 87, 0.12);
      margin-bottom: 20px;
    }

    .days-label {
      font-size: 0.9rem;
      color: #747d8c;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .days-count {
      font-size: 3.2rem;
      font-weight: 800;
      color: #ff4757;
      line-height: 1.1;
    }

    .days-unit {
      font-size: 1rem;
      color: #ff6b81;
      font-weight: bold;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .start-date {
      font-size: 0.85rem;
      color: #a4b0be;
      margin-top: 12px;
    }

    .quote-box {
      background: rgba(255, 234, 234, 0.7);
      padding: 12px 15px;
      border-radius: 12px;
      font-size: 0.85rem;
      color: #57606f;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title">BEEN IN LOVE</div>

    <!-- Profiles -->
    <div class="profiles">
      <div class="avatar-box">
        <img src="Shine.jpg" alt="Shine" class="avatar">
        <div class="name">Shine</div>
      </div>

      <div class="heart-icon">💖</div>

      <div class="avatar-box">
        <img src="May.jpg" alt="May" class="avatar">
        <div class="name">May</div>
      </div>
    </div>

    <!-- Days Counter -->
    <div class="counter-card">
      <div class="days-label">တွဲခဲ့သည့် ရက်ပေါင်း</div>
      <div class="days-count" id="daysCount">0</div>
      <div class="days-unit">DAYS</div>
      <div class="start-date">Start Date: 2025-10-09</div>
    </div>

    <!-- Love Quote -->
    <div class="quote-box">
      "Every love story is beautiful, but ours is my favorite." ✨
    </div>
  </div>

  <script>
    const startDateStr = "2025-10-09";

    function calculateDays() {
      const start = new Date(startDateStr);
      const today = new Date();
      
      const diffTime = Math.abs(today - start);
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      
      document.getElementById('daysCount').innerText = diffDays;
    }

    calculateDays();
  </script>
</body>
</html>
